name: Deploy starter kit checker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil file website
        uses: actions/checkout@v4
      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5
      - name: Unggah website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Terbitkan website
        id: deployment
        uses: actions/deploy-pages@v4
